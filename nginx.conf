# HSTS only when the proxy in front says the request came over HTTPS
map $http_x_forwarded_proto $hsts {
    https "max-age=31536000";
    default "";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # A location with its own add_header does not inherit these
    include /etc/nginx/snippets/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    # Resolved per request: nginx starts even while the backend is not up yet
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend http://backend:8000;

    client_max_body_size 1m;

    # Not application/json: API answers may hold secrets next to what the visitor sent
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/xml image/svg+xml;

    # X-Forwarded-For is replaced, not appended to: rate limits trust its first address.
    # Behind another proxy take the address from it with set_real_ip_from first.
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File uploads: keep in step with FILES_MAX_SIZE_MB of the backend (default 10)
    location /api/v1/files {
        client_max_body_size 11m;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI and ReDoc load their scripts from a CDN: no site CSP here
    location /docs {
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc {
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The file names hold a hash of the content: a new build brings new names
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # No trailing-slash redirect for prerendered pages, so /en matches its canonical URL.
    # Asked for again every time: an old page would name files of the previous build
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.html;
    }
}
