name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and format (Biome)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - uses: actions/checkout@v4
        with:
          repository: osnova-kit/osnova_backend
          path: backend

      # Same path as in local development: the generated types depend on it
      - name: API types are up to date
        run: |
          mkdir -p ../osnova_backend
          cp backend/openapi.json ../osnova_backend/openapi.json
          npm run generate:client
          git diff --exit-code src/api/generated || {
            echo "::error::src/api/generated is out of date: run npm run generate:client"
            exit 1
          }

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Docker Compose)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: osnova_frontend
    env:
      E2E_BASE_URL: http://localhost:8080
      E2E_EMAIL: root@example.com
    steps:
      - uses: actions/checkout@v4
        with:
          path: osnova_frontend
      - uses: actions/checkout@v4
        with:
          repository: osnova-kit/osnova_backend
          path: osnova_backend

      - name: Start the standard stack
        working-directory: osnova_backend
        run: |
          password=$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')
          echo "::add-mask::$password"
          echo "E2E_PASSWORD=$password" >> "$GITHUB_ENV"
          make init
          make up-standard
          make createroot ARGS="--email $E2E_EMAIL --password=$password"

      - uses: actions/setup-node@v4
        with:
          node-version-file: osnova_frontend/.nvmrc
          cache: npm
          cache-dependency-path: osnova_frontend/package-lock.json

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            osnova_frontend/playwright-report
            osnova_frontend/test-results
          retention-days: 7

      - name: Stack logs
        if: failure()
        working-directory: osnova_backend
        run: docker compose logs --no-color --tail 200

  # strip:begin any — a project that ran `npm run strip` keeps the modules it uses
  strip:
    name: npm run strip ${{ matrix.modules }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modules: [admin, files, notifications, auth]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Strip
        run: |
          npm run strip -- ${{ matrix.modules }} --apply --yes
          git status --short

      - name: Lint and format (Biome)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
  # strip:end
